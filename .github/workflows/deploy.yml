name: Deploy to Vercel

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    
    # Only deploy if the tag/release is on master branch
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish || github.ref }}

      - name: Verify branch is master
        run: |
          echo "Deploying from: ${{ github.ref }}"
          echo "Release target: ${{ github.event.release.target_commitish || 'N/A' }}"
          if [[ "${{ github.event_name }}" == "release" && "${{ github.event.release.target_commitish }}" != "master" ]]; then
            echo " Release is not targeting master branch. Aborting deploy."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
